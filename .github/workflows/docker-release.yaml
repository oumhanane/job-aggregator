name: Docker Release

on:
  push:
    tags:
      - "v*"

env:
  IMAGE_NAME: job-aggregator

jobs:

  docker-build-push:

    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: Build Docker image
        run: |
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/job-aggregator:${GITHUB_REF_NAME} .


      - name: Tag latest
        run: |
          docker tag \
          ${{ secrets.DOCKERHUB_USERNAME }}/job-aggregator:${GITHUB_REF_NAME} \
          ${{ secrets.DOCKERHUB_USERNAME }}/job-aggregator:latest


      - name: Push versioned image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/job-aggregator:${GITHUB_REF_NAME}


      - name: Push latest image
        run: |
          docker push \
          ${{ secrets.DOCKERHUB_USERNAME }}/job-aggregator:latest