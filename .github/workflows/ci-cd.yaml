name: CI Job Aggregator

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


env:
  IMAGE_NAME: job-aggregator


jobs:

  # -------------------------
  # TESTS
  # -------------------------
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (for tests)
        run: docker compose build

      - name: Run tests inside container
        run: docker compose run --rm job-aggregator python -m pytest


  # -------------------------
  # SAST + SCA
  # -------------------------
  security_analysis:
    name: SAST + SCA
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt


      - name: Install security tools
        run: |
          pip install bandit pip-audit


      - name: Run Bandit (SAST)
        run: |
          bandit -c bandit.yaml -r . -f json -o bandit-report.json || true


      - name: Run pip-audit (SCA)
        run: |
          pip-audit -r requirements.txt || true



  # -------------------------
  # CONTAINER SECURITY
  # -------------------------
  security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: security_analysis


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Build image
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:latest .


      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"